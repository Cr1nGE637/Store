<svg width="1280" height="780" viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Конкурентное поле StoreFit</title>
  <desc id="desc">Схема прямых и косвенных конкурентов StoreFit по уровню специализации на электронике и доступности для малого бизнеса.</desc>
  <rect width="1280" height="780" fill="#f6f7f9"/>

  <text x="64" y="66" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Конкурентное поле StoreFit</text>
  <text x="64" y="100" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">Сравнение по двум критериям: доступность для малого бизнеса и специализация на электронике</text>

  <rect x="110" y="150" width="760" height="480" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <line x1="170" y1="570" x2="810" y2="570" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="170" y1="570" x2="170" y2="210" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="490" y="616" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">Специализация на электронике</text>
  <text x="82" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151" transform="rotate(-90 82 395)">Доступность для малого бизнеса</text>

  <text x="170" y="595" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">универсальные решения</text>
  <text x="704" y="595" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">узкая специализация</text>
  <text x="132" y="575" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#6b7280">низкая</text>
  <text x="132" y="220" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#6b7280">высокая</text>

  <rect x="230" y="260" width="168" height="58" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="314" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tilda / CMS</text>
  <text x="314" y="306" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e40af">быстрый старт</text>

  <rect x="270" y="384" width="190" height="58" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="365" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">InSales / AdvantShop</text>
  <text x="365" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e40af">e-commerce платформы</text>

  <rect x="300" y="492" width="150" height="58" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="375" y="518" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#78350f">Веб-студии</text>
  <text x="375" y="538" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">дороже и дольше</text>

  <rect x="510" y="492" width="166" height="58" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="593" y="518" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#991b1b">Маркетплейсы</text>
  <text x="593" y="538" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c">трафик, но зависимость</text>

  <rect x="560" y="360" width="156" height="58" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="638" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#134e4a">МойСклад</text>
  <text x="638" y="406" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f766e">учет и остатки</text>

  <rect x="620" y="250" width="170" height="58" rx="8" fill="#e9d5ff" stroke="#c084fc"/>
  <text x="705" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#581c87">Конфигураторы ПК</text>
  <text x="705" y="296" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b21a8">узко под сборки</text>

  <rect x="635" y="150" width="190" height="70" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="730" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">StoreFit</text>
  <text x="730" y="202" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#166534">интернет-магазин +</text>
  <text x="730" y="217" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#166534">цифровой консультант</text>

  <rect x="920" y="150" width="300" height="480" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="948" y="188" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Вывод</text>
  <circle cx="958" cy="232" r="6" fill="#16a34a"/>
  <text x="978" y="237" font-family="Arial, sans-serif" font-size="15" fill="#374151">Ниша не пустая: рынок</text>
  <text x="978" y="258" font-family="Arial, sans-serif" font-size="15" fill="#374151">уже покупает сайты и SaaS.</text>
  <circle cx="958" cy="306" r="6" fill="#16a34a"/>
  <text x="978" y="311" font-family="Arial, sans-serif" font-size="15" fill="#374151">Свободнее всего зона</text>
  <text x="978" y="332" font-family="Arial, sans-serif" font-size="15" fill="#374151">специализации на электронике.</text>
  <circle cx="958" cy="380" r="6" fill="#dc2626"/>
  <text x="978" y="385" font-family="Arial, sans-serif" font-size="15" fill="#374151">Слабое место StoreFit:</text>
  <text x="978" y="406" font-family="Arial, sans-serif" font-size="15" fill="#374151">меньше бренда и интеграций.</text>
  <circle cx="958" cy="454" r="6" fill="#2563eb"/>
  <text x="978" y="459" font-family="Arial, sans-serif" font-size="15" fill="#374151">Преимущество: экспертный</text>
  <text x="978" y="480" font-family="Arial, sans-serif" font-size="15" fill="#374151">подбор прямо в магазине.</text>
  <circle cx="958" cy="528" r="6" fill="#f59e0b"/>
  <text x="978" y="533" font-family="Arial, sans-serif" font-size="15" fill="#374151">Лучший стартовый сегмент:</text>
  <text x="978" y="554" font-family="Arial, sans-serif" font-size="15" fill="#374151">комплектующие и сервис.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
