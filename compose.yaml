services:
  store.app:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Store.App/Dockerfile
    depends_on:
      Database:
        condition: service_healthy
    networks:
      - store_network
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    volumes:
      - ./backend/Store.App/wwwroot/uploads/products:/app/wwwroot/uploads/products
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__IdentityDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=identity
      - ConnectionStrings__CatalogDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=catalog
      - ConnectionStrings__CartDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=cart
      - ConnectionStrings__OrderingDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=ordering
      - ConnectionStrings__InventoryDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=inventory
      - ConnectionStrings__NotificationsDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=notifications
      - ConnectionStrings__ConsultingDbConnectionString=Host=Database;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=consulting
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN}
      - SmtpOptions__Username=${SMTP_USERNAME}
      - SmtpOptions__Password=${SMTP_PASSWORD}
      - SmtpOptions__FromAddress=${SMTP_FROM_ADDRESS}

  store.frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - store.app
    networks:
      - store_network
    ports:
      - "3000:80"

  Database:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database_volume:/var/lib/postgresql/data
    networks:
      - store_network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  store_network:

volumes:
  database_volume:
