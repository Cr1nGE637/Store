<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Организационная структура StoreFit</title>
  <desc id="desc">Схема подчинения и распределения функций в команде проекта StoreFit на этапе MVP.</desc>
  <rect width="1200" height="760" fill="#f6f7f9"/>

  <text x="64" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Организационная структура StoreFit</text>
  <text x="64" y="104" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">Команда на этапе MVP и первых коммерческих внедрений</text>

  <rect x="455" y="145" width="290" height="86" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3a8a">Руководитель проекта</text>
  <text x="600" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">продукт, финансы, продажи</text>

  <line x1="600" y1="231" x2="600" y2="284" stroke="#9ca3af" stroke-width="3"/>
  <line x1="230" y1="284" x2="970" y2="284" stroke="#9ca3af" stroke-width="3"/>
  <line x1="230" y1="284" x2="230" y2="322" stroke="#9ca3af" stroke-width="3"/>
  <line x1="480" y1="284" x2="480" y2="322" stroke="#9ca3af" stroke-width="3"/>
  <line x1="720" y1="284" x2="720" y2="322" stroke="#9ca3af" stroke-width="3"/>
  <line x1="970" y1="284" x2="970" y2="322" stroke="#9ca3af" stroke-width="3"/>

  <rect x="105" y="322" width="250" height="96" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="230" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">Backend-разработчик</text>
  <text x="230" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">API, домены, база данных</text>
  <text x="230" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">модуль совместимости</text>

  <rect x="355" y="322" width="250" height="96" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="480" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3730a3">Frontend-разработчик</text>
  <text x="480" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3730a3">интерфейс магазина</text>
  <text x="480" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3730a3">личный кабинет, админка</text>

  <rect x="605" y="322" width="230" height="96" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="720" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#78350f">Продажи и поддержка</text>
  <text x="720" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#92400e">поиск клиентов</text>
  <text x="720" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#92400e">сопровождение внедрений</text>

  <rect x="850" y="322" width="240" height="96" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="970" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">Аутсорсинг</text>
  <text x="970" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">бухгалтерия, дизайн</text>
  <text x="970" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">юрист, реклама, QA</text>

  <rect x="84" y="500" width="1032" height="144" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="112" y="536" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Принцип построения процессов</text>
  <circle cx="122" cy="576" r="6" fill="#2563eb"/>
  <text x="142" y="581" font-family="Arial, sans-serif" font-size="16" fill="#374151">Руководитель отвечает за стратегию, приоритизацию функций, финансы и работу с первыми клиентами.</text>
  <circle cx="122" cy="612" r="6" fill="#16a34a"/>
  <text x="142" y="617" font-family="Arial, sans-serif" font-size="16" fill="#374151">Разработка ядра продукта остается внутри команды, чтобы не терять контроль над технологией.</text>
  <circle cx="122" cy="648" r="6" fill="#dc2626"/>
  <text x="142" y="653" font-family="Arial, sans-serif" font-size="16" fill="#374151">Непрофильные и периодические задачи передаются на аутсорсинг для снижения постоянных расходов.</text>
</svg>
